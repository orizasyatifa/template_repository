project:
  type: book
  output-dir: docs
  resources:
    - .nojekyll
    - images/author/Oriza Syatifa.jpeg
    - epub-reader.html
    - assets/epub-reader.js

book:
  title: "Tugas Statistika"
  author: "Oriza Syatifa"
  date: today
  description: "Deskripsi singkat tentang buku"
  cover-image: images/Cover.jpeg
  repo-url: https://github.com/pakardata1/ebook-template-quarto.git
  repo-actions: [edit, issue]
  sidebar:
    tools:
      - icon: file-pdf
        href: Tugas-Statistika.pdf
        text: Pratinjau PDF
        aria-label: Pratinjau PDF
      - icon: journal
        href: epub-reader.html
        text: Pratinjau EPUB
        aria-label: Pratinjau EPUB
  chapters:
    - index.qmd
    - chapters/bab-1.qmd
    - chapters/bab-2.qmd
    - chapters/bab-3.qmd
    - references/referensi.qmd

bibliography:
  - references/book.bib
  - references/packages.bib
csl: references/ieee.csl
link-citations: true

format:
  html:
    theme: cosmo
    css: assets/style.css
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-fold: false
    smooth-scroll: true
    link-external-newwindow: true
    include-after-body: assets/hover-preview.html
    include-in-header:
      text: |
        <meta name="author" content="Oriza Syatifa">
  pdf:
    documentclass: book
    pdf-engine: xelatex
    keep-tex: true
    include-in-header: assets/preamble.tex
    number-sections: true
    toc: true
  epub:
    cover-image: images/Cover.jpeg

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

lang: id
